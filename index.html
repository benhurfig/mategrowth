<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#08733d">
    <title>MateGrowth</title>
    <style>
      :root {
        color-scheme: light;
        --green: #13a05a;
        --green-dark: #08733d;
        --green-soft: #eaf7ef;
        --ink: #0e1b2b;
        --muted: #556170;
        --surface: #ffffff;
        --border: #dce8e1;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        overflow-x: clip;
        background: var(--surface);
      }

      body {
        min-width: 20rem;
        min-height: 100svh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow-x: clip;
        background: var(--surface);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 0.1875rem solid var(--green);
        outline-offset: 0.25rem;
      }

      .site-header,
      .site-main,
      .site-footer {
        position: relative;
        z-index: 1;
      }

      .site-header {
        width: min(100% - 2rem, 72rem);
        margin-inline: auto;
        padding-block: 1.5rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .brand::before {
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 0.4rem var(--green-soft);
        content: "";
      }

      .site-main {
        display: grid;
        width: min(100% - 2rem, 72rem);
        margin-inline: auto;
        align-items: center;
        padding-block: clamp(3rem, 10vw, 7rem);
      }

      .hero {
        position: relative;
        max-width: 49rem;
      }

      .hero::after {
        position: absolute;
        z-index: -1;
        width: clamp(14rem, 40vw, 28rem);
        aspect-ratio: 1;
        top: 50%;
        left: min(68vw, 42rem);
        border: clamp(2.5rem, 7vw, 5rem) solid var(--green-soft);
        border-radius: 50%;
        content: "";
        transform: translateY(-50%);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--green-dark);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(2.8rem, 9vw, 5.75rem);
        font-weight: 850;
        letter-spacing: -0.055em;
        line-height: 0.98;
        text-wrap: balance;
      }

      .lead {
        max-width: 42rem;
        margin: clamp(1.5rem, 4vw, 2rem) 0 0;
        color: var(--muted);
        font-size: clamp(1.08rem, 2.5vw, 1.3rem);
        line-height: 1.65;
      }

      .service-note {
        max-width: 39rem;
        margin: clamp(2rem, 5vw, 2.75rem) 0 0;
        padding: 1rem 1.1rem;
        border-left: 0.25rem solid var(--green);
        border-radius: 0 0.75rem 0.75rem 0;
        background: var(--green-soft);
        font-weight: 700;
        line-height: 1.5;
      }

      .primary-button {
        display: inline-flex;
        min-height: 3.25rem;
        margin-top: 1.5rem;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 1.35rem;
        border-radius: 999px;
        background: var(--green-dark);
        box-shadow: 0 0.85rem 2rem rgb(8 115 61 / 18%);
        color: #ffffff;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
        transition: transform 180ms ease, background-color 180ms ease;
      }

      .primary-button:hover {
        background: #065c31;
        transform: translateY(-0.125rem);
      }

      .site-footer {
        border-top: 0.0625rem solid var(--border);
      }

      .site-footer__inner {
        display: flex;
        width: min(100% - 2rem, 72rem);
        margin-inline: auto;
        flex-direction: column;
        gap: 0.8rem;
        padding-block: 1.5rem;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .site-footer__brand {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .site-footer__brand strong {
        color: var(--ink);
      }

      .instagram {
        width: fit-content;
        color: var(--green-dark);
        font-weight: 750;
        text-underline-offset: 0.2em;
      }

      @media (min-width: 40rem) {
        .site-header,
        .site-main,
        .site-footer__inner {
          width: min(100% - 4rem, 72rem);
        }

        .site-footer__inner {
          flex-direction: row;
          align-items: flex-end;
          justify-content: space-between;
        }
      }

      @media (max-width: 29rem) {
        .primary-button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="brand">MateGrowth</span>
    </header>

    <main class="site-main">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">MateGrowth</p>
        <h1 id="page-title">Estamos construindo algo novo.</h1>
        <p class="lead">
          Em breve, você poderá conhecer melhor nossos serviços para ajudar empresas a
          serem encontradas e crescer.
        </p>
        <p class="service-note">
          Enquanto isso, conheça nosso serviço Google para Daycare.
        </p>
        <a class="primary-button" href="./gbp-daycare/">
          Conhecer Google para Daycare
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__brand">
          <strong>MateGrowth</strong>
          <span>Smart Systems. Real Growth.</span>
        </div>
        <a class="instagram"
           href="https://www.instagram.com/mategrowth.us/"
           target="_blank"
           rel="noopener noreferrer">
          Instagram
        </a>
      </div>
    </footer>
  </body>
</html>
