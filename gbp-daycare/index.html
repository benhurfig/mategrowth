<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#148a4b">
    <title>Google para Daycare | MateGrowth</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__wave hero__wave--top" aria-hidden="true"></div>

        <div class="hero__container">
          <div class="hero__content">
            <p class="hero__badge">
              <span class="hero__badge-dot" aria-hidden="true"></span>
              Google para Daycare
            </p>

            <h1 class="hero__title" id="hero-title">
              Tem <span class="hero__title-accent">vaga</span> no seu Home Daycare?
            </h1>

            <p class="hero__lead">
              Famílias da sua região podem estar procurando uma daycare no Google agora.
            </p>

            <p class="hero__support">Ajude sua daycare a ser encontrada.</p>

            <a class="hero__button" href="#servico">Conhecer o serviço</a>
          </div>

          <div class="hero__visual" aria-hidden="true">
            <div class="hero__visual-orbit hero__visual-orbit--one"></div>
            <div class="hero__visual-orbit hero__visual-orbit--two"></div>
            <div class="hero__image-placeholder">
              <span>Imagem da campanha</span>
            </div>
            <!--
              A imagem final substituirá o placeholder:
              <img src="./assets/images/hero-google-daycare.webp"
                   alt="Provedora de Home Daycare em seu ambiente de trabalho">
            -->
          </div>
        </div>

        <div class="hero__wave hero__wave--bottom" aria-hidden="true"></div>
      </section>
    </main>

    <script src="./js/main.js" defer></script>
  </body>
</html>
